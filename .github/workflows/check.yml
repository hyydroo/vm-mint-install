name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n install.sh
      - name: ShellCheck
        run: shellcheck -S warning install.sh
      - name: Dry run
        run: bash install.sh --dry-run --yes
